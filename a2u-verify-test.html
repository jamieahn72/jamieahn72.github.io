<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KMON A2U 사용자 확인 테스트</title>
<style>
body{font-family:system-ui,sans-serif;max-width:580px;margin:48px auto;padding:0 18px;line-height:1.65;background:#faf8f4;color:#17253a}
main{padding:24px;border:1px solid #d7d7d7;border-radius:14px;background:white}
button{background:#183c67;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#result{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#f1f3f6;border-radius:8px}
small{color:#555}
</style>
</head>
<body>
<main>
<h1>KMON A2U 사용자 확인 테스트</h1>
<p>기존 KMON 테스트넷에서 Pi 로그인한 뒤, 이 페이지에서 사용자 확인을 시험합니다.</p>
<p><strong>Test Pi 송금 기능은 없습니다.</strong> 이 페이지는 로그인 상태를 변경하거나 결제를 실행하지 않습니다.</p>
<p><a href="./sandbox.html">KMON 테스트넷으로 이동</a></p>
<button id="verify" type="button">로그인한 사용자 확인</button>
<p id="result" role="status" aria-live="polite">아직 확인하지 않았습니다.</p>
<small>확인 시 Pi 인증 토큰을 KMON의 별도 확인 서버에 전송합니다. 화면이나 로그에 토큰을 출력하지 않습니다. 공유 기기에서는 테스트 후 KMON에서 로그아웃하세요.</small>
</main>
<script>
(() => {
  'use strict';
  const button = document.getElementById('verify');
  const result = document.getElementById('result');
  button.addEventListener('click', async () => {
    const token = sessionStorage.getItem('pi_access_token');
    if (!token) {
      result.textContent = '이 브라우저 탭에 Pi 로그인 정보가 없습니다. KMON 테스트넷에서 로그인한 후 같은 탭에서 다시 열어 주세요.';
      return;
    }
    button.disabled = true;
    result.textContent = 'Pi 계정을 확인하고 있습니다...';
    try {
      const response = await fetch('https://kmon-a2u-testnet.jamieahn72.workers.dev/verify-recipient', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({accessToken: token}),
        cache: 'no-store'
      });
      const data = await response.json();
      if (!response.ok || data.verified !== true) {
        result.textContent = '확인 실패 (HTTP ' + response.status + '). 로그인 상태 또는 서버 설정을 확인해 주세요.';
        return;
      }
      result.textContent = '사용자 확인 성공: @' + String(data.username || '(이름 없음)') + '\n송금 기능: 비활성화';
    } catch (_) {
      result.textContent = '서버 연결에 실패했습니다. CORS 설정 또는 네트워크를 확인해 주세요.';
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
