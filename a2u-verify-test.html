<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KMON A2U 사용자 확인 테스트</title>
<style>
body{font-family:system-ui,sans-serif;max-width:580px;margin:48px auto;padding:0 18px;line-height:1.65;background:#faf8f4;color:#17253a}
main{padding:24px;border:1px solid #d7d7d7;border-radius:14px;background:white}
button{background:#183c67;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#result{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#f1f3f6;border-radius:8px}
small{color:#555}
</style>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
<main>
<h1>KMON A2U 사용자 확인 테스트</h1>
<p>Pi Browser에서 KMON Testnet으로 이 페이지를 열고 수신자 확인에 필요한 권한에 동의하세요.</p>
<p>수신 권한에 동의하면 Test Pi 수신 신청이 등록됩니다.</p>
<p><a href="./sandbox.html">KMON 테스트넷으로 이동</a></p>
<button id="verify" type="button">Test Pi 수신 신청</button>
<p id="result" role="status" aria-live="polite">아직 확인하지 않았습니다.</p>
<small>확인 시 Pi 인증 토큰을 KMON의 별도 확인 서버에 전송합니다. 화면이나 로그에 토큰을 출력하지 않습니다.</small>
</main>
<script>
(() => {
  'use strict';
  const button = document.getElementById('verify');
  const result = document.getElementById('result');
  const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function requestStatus(accessToken, register) {
    const response = await fetch('https://kmon-a2u-testnet.jamieahn72.workers.dev/verify-recipient', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({accessToken, register, status: !register}),
      cache: 'no-store',
      redirect: 'error',
      signal: AbortSignal.timeout(15000)
    });
    const data = await response.json();
    if (!response.ok || data.verified !== true || data.registered !== true) {
      throw new Error(data.code === 'missing_scopes' ? 'missing_scopes' : 'verification_failed');
    }
    return data.payout;
  }

  button.addEventListener('click', async () => {
    if (location.origin !== 'https://jamieahn72.github.io' || !window.Pi) {
      result.textContent = 'Pi Browser에서 KMON Testnet 앱 주소로 이 페이지를 열어 주세요.';
      return;
    }
    button.disabled = true;
    result.textContent = 'Pi 계정을 확인하고 있습니다...';
    let registered = false;
    try {
      window.Pi.init({ version: '2.0', sandbox: true });
      const { accessToken } = await window.Pi.authenticate(
        ['username', 'payments', 'wallet_address'],
        () => {}
      );
      if (!accessToken) {
        result.textContent = 'Pi 인증을 완료하지 못했습니다. 다시 시도해 주세요.';
        return;
      }
      let payout = await requestStatus(accessToken, true);
      registered = true;
      result.textContent = 'Test Pi 수신 신청 완료. 송금 상태를 확인하고 있습니다.';
      for (let attempt = 0; payout === 'pending' && attempt < 20; attempt++) {
        await delay(15000);
        payout = await requestStatus(accessToken, false);
      }
      result.textContent = payout === 'completed' ? 'Test Pi 송금 완료'
        : payout === 'duplicate_wallet' ? '이 지갑에는 이미 Test Pi를 지급했습니다.'
        : 'Test Pi 수신 신청 완료. 처리 결과는 이 버튼을 눌러 다시 확인할 수 있습니다.';
    } catch (error) {
      result.textContent = registered ? '수신 신청은 등록됐습니다. 버튼을 눌러 송금 상태를 다시 확인해 주세요.'
        : error.message === 'missing_scopes' ? '필수 권한에 모두 동의한 뒤 다시 확인해 주세요.'
        : 'Pi 인증 또는 서버 연결을 완료하지 못했습니다. Pi Browser에서 다시 시도해 주세요.';
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
